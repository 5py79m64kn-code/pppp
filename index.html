<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06111b">
<title>Finora — Keuangan Usaha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#06111b;--card:#0b1a27;--card2:#102235;--line:#1b3042;
  --green:#00e49a;--green2:#00bd7d;--white:#f5f8fc;
  --muted:#91a3b5;--red:#ff5268;--pink:#ee75bd
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:scale(.985)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.hidden{display:none!important}
.app{width:100%;max-width:430px;min-height:100dvh;margin:0 auto;padding:12px 16px calc(100px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:8px;font-weight:850;font-size:21px;letter-spacing:-.7px}
.brand svg{width:31px;height:31px;flex-shrink:0}
.round{border:1px solid var(--line);background:var(--card);color:var(--white);border-radius:50%;height:40px;width:40px;font-size:17px;display:grid;place-items:center;flex-shrink:0}
h1{font-size:23px;letter-spacing:-.6px;line-height:1.25;margin:0 0 7px}
h2{font-size:17px;margin:0}
h3{font-size:13px;margin:0}
p{line-height:1.6}
.muted{color:var(--muted)}
.small{font-size:11px}
.subheading{color:var(--muted);font-size:11px;line-height:1.6;margin:0 0 17px}
.balance{padding:18px 15px;border-radius:15px;background:linear-gradient(120deg,#00895c,#00885d);margin:15px 0 10px;position:relative;overflow:hidden}
.balance:after{content:"";position:absolute;right:-60px;top:-90px;width:170px;height:170px;border-radius:50%;border:23px solid #ffffff0b;pointer-events:none}
.balance-label{font-size:11px;color:#d4ffec}
.balance-amount{font-size:27px;font-weight:850;letter-spacing:-.8px;margin:7px 0;overflow-wrap:anywhere}
.balance-foot{font-size:10px;color:#d4ffec}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--card);border:1px solid #102c3c;border-radius:13px;padding:12px;min-width:0}
.stat-label{font-size:10px;color:var(--muted);margin-bottom:8px}
.stat-amount{font-size:clamp(13px,3.8vw,17px);font-weight:800;overflow-wrap:anywhere}
.green{color:var(--green)}
.red{color:var(--red)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:21px 0 10px}
.text-btn{background:none;border:0;color:var(--green);font-size:10px;font-weight:750;padding:8px}
.card{background:var(--card);border:1px solid #132a3a;border-radius:14px;padding:12px;margin-bottom:10px}
.chart{height:118px;display:flex;gap:9px;align-items:stretch;padding-top:7px}
.chart-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px}
.chart-bars{height:86px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.bar{width:8px;max-width:40%;border-radius:5px 5px 2px 2px;min-height:2px}
.chart-label{font-size:9px;color:var(--muted)}
.legend{display:flex;gap:15px;color:var(--muted);font-size:10px;margin-top:10px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.tx{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #ffffff0b}
.tx:last-child{border-bottom:0}
.tx-icon{height:36px;width:36px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;background:#123d35;color:var(--green);font-size:17px}
.tx-icon.expense{background:#38232e;color:#ff92a6}
.tx-main{flex:1;min-width:0}
.tx-title{font-weight:700;font-size:12px;overflow-wrap:anywhere}
.tx-date{font-size:10px;color:var(--muted);margin-top:4px}
.tx-right{text-align:right;flex-shrink:0;max-width:48%}
.tx-money{font-weight:750;font-size:11px;white-space:normal;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);font-size:11px;padding:23px 8px;line-height:1.8}
.nav{position:fixed;z-index:100;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:8px 7px calc(8px + env(safe-area-inset-bottom));background:rgba(5,17,28,.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:45px;background:none;border:0;color:#8295a8;padding:4px 0;font-size:10px;white-space:nowrap;border-radius:10px}
.nav-item .ico{font-size:21px;line-height:23px}
.nav-item.active{color:var(--green)}
.nav-add{justify-self:center;align-self:center;width:44px;height:44px;min-width:44px;min-height:44px;padding:0;border-radius:50%;border:3px solid #07131f;background:var(--green);color:#04271c;font-size:27px;font-weight:400;line-height:1;display:flex;align-items:center;justify-content:center;margin:0;box-shadow:0 0 0 1px #00e49a65}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:750;font-size:12px;display:inline-flex;align-items:center;justify-content:center;min-height:42px;text-align:center}
.btn-green{background:var(--green);color:#05271c}
.btn-muted{background:var(--card2);border:1px solid var(--line);color:var(--white)}
.btn-danger{background:#49232d;color:#ffc4ce}
.full{width:100%}
.field{display:grid;gap:7px;margin:14px 0}
.field label{font-size:11px;font-weight:650;color:#d0dce7}
.field input,.field select,.field textarea,.search{width:100%;padding:12px;background:#081521;border:1px solid var(--line);border-radius:10px;color:var(--white);outline:none;min-width:0;font-size:13px;min-height:43px}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--green)}
.field input::placeholder,.field textarea::placeholder,.search::placeholder{color:#71869a}
.field select{color-scheme:dark}
.field input[type="date"]{color-scheme:dark}
.type-tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:3px 0 17px}
.type-tabs button{padding:13px 8px;border:1px solid var(--line);background:var(--card2);color:var(--white);border-radius:12px;font-size:12px;font-weight:750;min-height:72px}
.type-tabs .chosen.income{border-color:var(--green);background:#0b352c;color:var(--green)}
.type-tabs .chosen.expense{border-color:var(--red);background:#38202b;color:#ff92a6}
.form-card{padding:14px}
.row{display:flex;gap:9px}
.row>*{flex:1;min-width:0}
.toolbar{display:flex;gap:8px;margin:12px 0}
.toolbar>*{flex:1;min-width:0}
.toolbar select{background:var(--card);color:var(--white);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:12px}
.tool{display:flex;align-items:center;gap:11px;width:100%;padding:13px;margin-bottom:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--white);min-height:65px}
.tool-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#103b32;color:var(--green);font-size:21px;flex-shrink:0}
.tool-icon.pink{background:#3b263b;color:var(--pink)}
.tool-info{flex:1;min-width:0}
.tool-title{font-size:12px;font-weight:750;margin-bottom:4px}
.tool-desc{font-size:10px;color:var(--muted);line-height:1.55}
.chevron{font-size:21px;color:#8296a9}
.result{background:#09291f;border:1px solid #17664d;border-radius:13px;padding:13px;margin-top:14px}
.result-title{font-weight:750;margin-bottom:9px;font-size:12px}
.result-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff10;font-size:11px}
.result-row:last-child{border:0}
.result-row b{text-align:right;overflow-wrap:anywhere}
.result-total{color:var(--green);font-size:14px}
.bill-status{display:inline-block;border-radius:7px;background:#103c30;color:#9bffda;padding:4px 7px;font-size:9px;margin-top:5px}
.bill-status.due{background:#46222d;color:#ffb3c2}
.profile{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #ffffff0d}
.profile:last-child{border:0}
.profile-icon{width:36px;height:36px;flex-shrink:0;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:17px}
.profile-info{flex:1;min-width:0}
.profile-name{font-weight:700;font-size:12px}
.profile-desc{font-size:10px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.pill{background:#103a2f;color:var(--green);padding:5px 8px;border-radius:9px;font-size:10px}
.profile-action{width:100%;text-align:left;color:var(--white);background:transparent;border:0;font:inherit;cursor:pointer;min-height:60px}
.profile-action:active{background:#102235;border-radius:10px}
.notice{padding:12px;background:var(--card2);border:1px solid var(--line);border-radius:10px;font-size:12px;line-height:1.6;margin-bottom:12px;overflow-wrap:anywhere}
.auth-screen{min-height:100dvh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:400px;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:20px}
.auth-card h1{margin-top:22px}
.auth-switch{background:none;border:0;color:var(--green);padding:12px 0;font-size:12px}
footer{text-align:center;color:#61778a;font-size:10px;padding:20px 0}
button:disabled{opacity:.55;cursor:not-allowed}
@media(min-width:500px){.app{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>

<section class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M7 20C7 11 13 6 22 6h17l-9 9H22c-4 0-6 2-6 6v6l-9 8V20Z" fill="#00e49a"/>
        <path d="M41 28c0 9-6 14-15 14H9l9-9h8c4 0 6-2 6-6v-6l9-8v15Z" fill="#00e49a"/>
        <path d="M18 27l9-9h8l-9 9h-8Z" fill="#f5f8fc"/>
      </svg>
      Finora
    </div>
    <p class="muted">Kelola keuangan pribadi dan usaha dengan lebih mudah.</p>
    <h1 id="authHeading">Selamat datang</h1>
    <p class="muted small" id="authSub">Masuk ke akun Finora kamu.</p>
    <div id="authMessage"></div>
    <form id="authForm">
      <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="nama@email.com" autocomplete="email" required></div>
      <div class="field"><label for="password">Kata sandi</label><input type="password" id="password" minlength="6" placeholder="Minimal 6 karakter" autocomplete="current-password" required></div>
      <div class="field hidden" id="confirmField"><label for="confirmPassword">Ulangi kata sandi</label><input type="password" id="confirmPassword" minlength="6" autocomplete="new-password"></div>
      <button class="btn btn-green full" id="authSubmit" type="submit">Masuk</button>
    </form>
    <button class="auth-switch" id="toggleAuth" type="button">Belum punya akun? Daftar</button>
    <button class="auth-switch" id="forgotPassword" type="button">Lupa kata sandi?</button>
  </div>
</section>

<div class="app hidden" id="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M7 20C7 11 13 6 22 6h17l-9 9H22c-4 0-6 2-6 6v6l-9 8V20Z" fill="#00e49a"/>
        <path d="M41 28c0 9-6 14-15 14H9l9-9h8c4 0 6-2 6-6v-6l9-8v15Z" fill="#00e49a"/>
        <path d="M18 27l9-9h8l-9 9h-8Z" fill="#f5f8fc"/>
      </svg>
      Finora
    </div>
    <button class="round" id="quickSettings" type="button" aria-label="Pengaturan">⚙</button>
  </header>
  <main id="screen"></main>
  <footer>Finora · powered by pratama andika</footer>
</div>

<nav class="nav hidden" id="nav" aria-label="Navigasi utama">
  <button class="nav-item active" type="button" data-page="home"><span class="ico">⌂</span><span>Beranda</span></button>
  <button class="nav-item" type="button" data-page="history"><span class="ico">▤</span><span>Riwayat</span></button>
  <button class="nav-add" type="button" id="addNav" aria-label="Tambah transaksi">+</button>
  <button class="nav-item" type="button" data-page="more"><span class="ico">☷</span><span>Lainnya</span></button>
  <button class="nav-item" type="button" data-page="settings"><span class="ico">⚙</span><span>Pengaturan</span></button>
</nav>

<script>
(function(){
"use strict";

const SUPABASE_URL="https://doqevpmqvhcnyffhmeia.supabase.co";
const SUPABASE_KEY="sb_publishable_DFfi7L-5zCsznP3BcQBUDA_VLaHw9X2";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
const screen=$("screen");

let user=null;
let page="home";
let authMode="login";
let txType="income";
let filter="all";
let search="";
let data={transactions:[],bills:[]};

const uid=()=>window.crypto?.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
const formatNumber=n=>new Intl.NumberFormat("id-ID",{maximumFractionDigits:0,useGrouping:true}).format(Number(n)||0);
const digits=v=>String(v??"").replace(/\D/g,"");
const today=()=>{
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};
const dateFmt=d=>d?new Date(d+"T12:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}):"-";

function notice(el,msg){
  el.innerHTML='<div class="notice">'+esc(msg)+'</div>';
}

/* Input angka: hanya digit, tampilan otomatis memakai pemisah ribuan. */
function bindNumberInput(input){
  if(!input)return;
  input.type="text";
  input.inputMode="numeric";
  input.autocomplete="off";
  input.addEventListener("input",()=>{
    const raw=digits(input.value);
    const formatted=raw?formatNumber(Number(raw)): "";
    input.value=formatted;
  });
}

function readNumber(value){
  const raw=digits(value);
  return raw?Number(raw):0;
}

function totals(){
  return data.transactions.reduce((a,t)=>{
    const amount=Math.max(0,Number(t.amount)||0);
    if(t.type==="income")a.income+=amount;
    if(t.type==="expense")a.expense+=amount;
    return a;
  },{income:0,expense:0});
}

function setPage(p){
  page=p;
  render();
  window.scrollTo({top:0,behavior:"instant"});
}

async function save(show=true){
  try{
    localStorage.setItem("finora_data",JSON.stringify(data));
  }catch(e){
    console.error("Gagal menyimpan data lokal:",e);
  }

  if(!user)return true;

  try{
    const {error}=await client.from("finora_data").upsert({
      user_id:user.id,
      payload:data,
      updated_at:new Date().toISOString()
    },{onConflict:"user_id"});

    if(error)throw error;
    return true;
  }catch(error){
    console.error(error);
    if(show){
      alert("Data tersimpan di perangkat, tetapi sinkronisasi gagal. Periksa tabel dan izin Supabase.\n"+error.message);
    }
    return false;
  }
}

async function load(){
  try{
    const {data:row,error}=await client.from("finora_data")
      .select("payload")
      .eq("user_id",user.id)
      .maybeSingle();

    if(error)throw error;

    if(row&&row.payload){
      data={
        transactions:Array.isArray(row.payload.transactions)?row.payload.transactions:[],
        bills:Array.isArray(row.payload.bills)?row.payload.bills:[]
      };
    }else{
      try{
        const local=JSON.parse(localStorage.getItem("finora_data")||"null");
        if(local){
          data={
            transactions:Array.isArray(local.transactions)?local.transactions:[],
            bills:Array.isArray(local.bills)?local.bills:[]
          };
        }
      }catch(e){}
      await save(false);
    }

    localStorage.setItem("finora_data",JSON.stringify(data));
  }catch(e){
    console.error("Gagal memuat data dari server:",e);
    try{
      const local=JSON.parse(localStorage.getItem("finora_data")||"null");
      if(local){
        data={
          transactions:Array.isArray(local.transactions)?local.transactions:[],
          bills:Array.isArray(local.bills)?local.bills:[]
        };
      }
    }catch(_){}
  }
}

async function openApp(){
  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("nav").classList.remove("hidden");
  await load();
  render();
}

function setAuthMode(m){
  authMode=m;
  $("authHeading").textContent=m==="login"?"Selamat datang":"Buat akun Finora";
  $("authSub").textContent=m==="login"?"Masuk ke akun Finora kamu.":"Daftar untuk mulai mencatat keuangan.";
  $("authSubmit").textContent=m==="login"?"Masuk":"Daftar";
  $("confirmField").classList.toggle("hidden",m==="login");
  $("confirmPassword").required=m==="register";
  $("forgotPassword").classList.toggle("hidden",m!=="login");
  $("toggleAuth").textContent=m==="login"?"Belum punya akun? Daftar":"Sudah punya akun? Masuk";
  $("password").autocomplete=m==="login"?"current-password":"new-password";
}

$("toggleAuth").onclick=()=>{
  setAuthMode(authMode==="login"?"register":"login");
  $("authMessage").innerHTML="";
};

$("authForm").onsubmit=async e=>{
  e.preventDefault();

  const email=$("email").value.trim();
  const password=$("password").value;
  const btn=$("authSubmit");

  btn.disabled=true;
  btn.textContent="Memproses...";

  try{
    let res;

    if(authMode==="register"){
      if(password!==$("confirmPassword").value){
        throw Error("Konfirmasi kata sandi tidak cocok.");
      }

      res=await client.auth.signUp({email,password});
      if(res.error)throw res.error;

      if(!res.data.session){
        notice($("authMessage"),"Akun dibuat. Periksa email untuk verifikasi sebelum masuk.");
        return;
      }
    }else{
      res=await client.auth.signInWithPassword({email,password});
      if(res.error)throw res.error;
    }

    user=res.data.user;
    await openApp();
  }catch(err){
    notice($("authMessage"),err.message||"Gagal masuk.");
  }finally{
    btn.disabled=false;
    btn.textContent=authMode==="login"?"Masuk":"Daftar";
  }
};

$("forgotPassword").onclick=async()=>{
  const email=$("email").value.trim();

  if(!email)return alert("Masukkan email terlebih dahulu.");

  const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.href});

  alert(error?error.message:"Jika email terdaftar, tautan reset akan dikirim ke email.");
};

client.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT"){
    user=null;
    data={transactions:[],bills:[]};
    page="home";
    $("app").classList.add("hidden");
    $("nav").classList.add("hidden");
    $("authScreen").classList.remove("hidden");
    setAuthMode("login");
  }
});

(async()=>{
  try{
    const {data:s}=await client.auth.getSession();
    if(s.session){
      user=s.session.user;
      await openApp();
    }
  }catch(e){
    console.error(e);
  }
})();

/* Semua navigasi menggunakan event listener yang jelas. */
document.querySelectorAll("[data-page]").forEach(b=>{
  b.addEventListener("click",()=>setPage(b.dataset.page));
});

$("addNav").addEventListener("click",()=>{
  txType="income";
  setPage("add");
});

$("quickSettings").addEventListener("click",()=>setPage("settings"));

function txIcon(t){
  return t.type==="income"?"↗":"↘";
}

function txRow(t,remove=false){
  return `<div class="tx">
    <div class="tx-icon ${t.type==="expense"?"expense":""}">${txIcon(t)}</div>
    <div class="tx-main">
      <div class="tx-title">${esc(t.name||"Transaksi")}</div>
      <div class="tx-date">${dateFmt(t.date)}</div>
    </div>
    <div class="tx-right">
      <div class="tx-money ${t.type==="income"?"green":"red"}">${t.type==="income"?"+":"−"} ${money(t.amount)}</div>
      ${remove?`<button type="button" class="text-btn" data-remove-tx="${esc(t.id)}">Hapus</button>`:""}
    </div>
  </div>`;
}

function billRow(b){
  const days=Math.ceil((new Date(b.due+"T23:59:59")-new Date())/86400000);
  const status=b.paid?"Lunas":days<0?"Terlambat":days===0?"Hari ini":days+" hari lagi";

  return `<div class="tx">
    <div class="tx-icon ${b.paid?"":"expense"}">${b.paid?"✓":"♧"}</div>
    <div class="tx-main">
      <div class="tx-title">${esc(b.name)}</div>
      <div class="tx-date">Jatuh tempo ${dateFmt(b.due)}</div>
      <span class="bill-status ${!b.paid&&days<=3?"due":""}">${status}</span>
    </div>

function download(text,type,name){
  const blob=new Blob([text],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function backupJSON(){
  download(JSON.stringify(data,null,2),"application/json","finora-backup.json");
}

function exportCSV(){
  const rows=[["Tanggal","Jenis","Keterangan","Nominal"]];

  data.transactions.forEach(t=>{
    rows.push([
      t.date,
      t.type==="income"?"Pemasukan":"Pengeluaran",
      t.name,
      t.amount
    ]);
  });

  const csv="\uFEFF"+rows.map(r=>
    r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")
  ).join("\r\n");

  download(csv,"text/csv;charset=utf-8","finora-transaksi.csv");
}

function render(){
  document.querySelectorAll(".nav-item").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===page);
  });

  const routes={
    home:renderHome,
    add:renderAdd,
    history:renderHistory,
    more:renderMore,
    calculator:renderCalculator,
    bills:renderBills,
    reports:renderReports,
    settings:renderSettings
  };

  (routes[page]||renderHome)();
}

/* Delegasi klik untuk tombol dinamis agar tetap berfungsi setelah render. */
screen.addEventListener("click",async e=>{
  const go=e.target.closest("[data-go]");

  if(go){
    setPage(go.dataset.go);
    return;
  }

  const csv=e.target.closest("[data-action='csv']");

  if(csv){
    exportCSV();
    return;
  }

  const del=e.target.closest("[data-remove-tx]");

  if(del){
    if(confirm("Hapus transaksi ini?")){
      data.transactions=data.transactions.filter(t=>String(t.id)!==del.dataset.removeTx);
      await save(false);
      render();
    }
    return;
  }

  const paid=e.target.closest("[data-paid]");

  if(paid){
    const b=data.bills.find(x=>String(x.id)===paid.dataset.paid);

    if(b){
      b.paid=!b.paid;
      await save(false);
      render();
    }
    return;
  }

  const delBill=e.target.closest("[data-remove-bill]");

  if(delBill){
    if(confirm("Hapus tagihan ini?")){
      data.bills=data.bills.filter(b=>String(b.id)!==delBill.dataset.removeBill);
      await save(false);
      render();
    }
  }
});

/* Menangani tombol kembali browser agar navigasi tidak terasa macet. */
window.addEventListener("popstate",()=>{
  if(!$("app").classList.contains("hidden")){
    page="home";
    render();
  }
});

})();
</script>
</body>
</html>
